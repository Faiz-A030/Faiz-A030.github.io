<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy Linktree</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #38393e;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;

        }

        #linktree {
            background-color: black;
            max-width: 600px;
        }

        #linktree {
            position: relative;
        }

        #linktree::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("https://www.transparenttextures.com/patterns/noise.png");
            opacity: 0.15;
            pointer-events: none;
        }

        .icon {
            width: 40px;
            height: 40px;
            background-color: rgb(245, 245, 245);
        }
        .icon:hover{
            background-color: white;
        }
        .icon svg {
            width: 20px;
            height: 20px;
            display: block;
        }
        

        #logo img {
            width: 100px;
            height: 100px;
        }

        #tekslogo {
            color: rgb(255, 255, 255);
        }

        .username {
            font-size: 28px;
            font-weight: 700;
        }

        .bio {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.5;

        }


        .button-main {
            background-color: rgb(35, 35, 36);
            width: 100%;
            font-size: 18px;
            font-weight: 600;
            color: rgb(255, 255, 255);
        }
        .button-main:hover{
            background-color: rgb(231, 231, 231);
        }
     
        #footer p, #footer a{
            font-size: 10px;
            font-weight: 400;
            color: rgb(255, 255, 255);
        }
    
  
    </style>
    <script src="https://unpkg.com/feather-icons"></script>

</head>

<body class="p-lg-4">
    <div class="container rounded p-4" id="linktree">
        <!-- Start button nav -->
        <div class="d-flex justify-content-between align-items-center">
            <div class="icon rounded-circle d-flex align-items-center justify-content-center">
                <i data-feather="link-2"></i>
            </div>
            <div class="d-flex gap-1">
                <div class="icon rounded-circle d-flex align-items-center justify-content-center">
                    <i data-feather="upload"></i>
                </div>
            </div>
        </div>
        <!-- End button nav -->
        <!-- Start Logo section -->
        <div class="container d-flex flex-column justify-content-center align-items-center mt-3" id="logo">
            <img src="assets/img/images.png" alt="" class="rounded-circle">
            <p class="username" id="tekslogo">@reclays.id</p>
        </div>
        <!-- End Logo section -->
        <!-- Start button main -->
        <div class="d-flex flex-column align-items-center mt-3 gap-3">
            <a href="#" class="btn button-main shadow-sm p-3 mt-3">Lazada Mall</a>
            <a href="#" class="btn button-main shadow-sm p-3 mt-3">Zalora</a>
            <a href="#" class="btn button-main shadow-sm p-3 mt-3">Tokopedia Mall</a>
            <a href="#" class="btn button-main shadow-sm p-3 mt-3">Shopee Mall</a>
        <p></p>
        <!-- End button main -->
        <!-- Start Footer -->
        <div id="footer" class="text-center mt-5">
            <p><a href="#">Cookie Preferences</a> • <a href="#">Report</a> • <a href="#">Privacy</a> • <a href="#">Explore</a> </p>
        </div>
        <!-- End Footer -->
    </div>


    <script>
        feather.replace();
    </script>
</body>

</html>
